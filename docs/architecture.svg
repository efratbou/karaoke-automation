<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fd1c5"/>
    </marker>
  </defs>

  <rect width="900" height="340" rx="14" fill="#1b1f2a"/>

  <text x="450" y="38" text-anchor="middle" fill="#f5f6fa" font-size="22" font-weight="600">Karaoke Automation — How It Works</text>
  <text x="450" y="62" text-anchor="middle" fill="#9aa5b1" font-size="13">From a recorded phone call to a logged reservation — with zero manual typing</text>

  <!-- Box 1 -->
  <rect x="55" y="110" width="160" height="150" rx="12" fill="#262c3b" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="135" y="158" text-anchor="middle" font-size="36">📱</text>
  <text x="135" y="188" text-anchor="middle" fill="#f5f6fa" font-size="14" font-weight="600">iPhone Shortcut</text>
  <text x="135" y="208" text-anchor="middle" fill="#9aa5b1" font-size="11">Pick an existing call</text>
  <text x="135" y="224" text-anchor="middle" fill="#9aa5b1" font-size="11">recording and upload it</text>

  <!-- Box 2 -->
  <rect x="265" y="110" width="160" height="150" rx="12" fill="#262c3b" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="345" y="158" text-anchor="middle" font-size="36">🌐</text>
  <text x="345" y="188" text-anchor="middle" fill="#f5f6fa" font-size="14" font-weight="600">Express Server</text>
  <text x="345" y="208" text-anchor="middle" fill="#9aa5b1" font-size="11">POST /upload (Multer)</text>
  <text x="345" y="224" text-anchor="middle" fill="#9aa5b1" font-size="11">free-tier host on Render</text>

  <!-- Box 3 -->
  <rect x="475" y="110" width="160" height="150" rx="12" fill="#262c3b" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="555" y="158" text-anchor="middle" font-size="36">🤖</text>
  <text x="555" y="188" text-anchor="middle" fill="#f5f6fa" font-size="14" font-weight="600">Gemini API</text>
  <text x="555" y="208" text-anchor="middle" fill="#9aa5b1" font-size="11">Listens to the Hebrew call</text>
  <text x="555" y="224" text-anchor="middle" fill="#9aa5b1" font-size="11">extracts structured JSON</text>

  <!-- Box 4 -->
  <rect x="685" y="110" width="160" height="150" rx="12" fill="#262c3b" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="765" y="158" text-anchor="middle" font-size="36">📊</text>
  <text x="765" y="188" text-anchor="middle" fill="#f5f6fa" font-size="14" font-weight="600">Google Sheet</text>
  <text x="765" y="208" text-anchor="middle" fill="#9aa5b1" font-size="11">New reservation row</text>
  <text x="765" y="224" text-anchor="middle" fill="#9aa5b1" font-size="11">appended automatically</text>

  <!-- Arrows -->
  <line x1="217" y1="185" x2="261" y2="185" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="427" y1="185" x2="471" y2="185" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="637" y1="185" x2="681" y2="185" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="300" text-anchor="middle" fill="#6b7685" font-size="12">TypeScript · Express · Multer · Gemini API (@google/genai) · Google Sheets API</text>
</svg>
